# Install once: uvx pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: validate-repo
        name: repository invariants
        entry: uv run tools/validate_repo.py
        language: system
        pass_filenames: false
        always_run: true
