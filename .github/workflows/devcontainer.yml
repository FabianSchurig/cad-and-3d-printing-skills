name: Devcontainer

on:
  push:
    branches: [main]
    paths: [".devcontainer/**", "pyproject.toml", "uv.lock", ".github/workflows/devcontainer.yml"]
  pull_request:
    paths: [".devcontainer/**", "pyproject.toml", "uv.lock", ".github/workflows/devcontainer.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the devcontainer and run the test suite inside it
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: uv run pytest -q
