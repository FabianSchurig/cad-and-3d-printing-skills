version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule: { interval: monthly }
  - package-ecosystem: devcontainers
    directory: /
    schedule: { interval: monthly }
